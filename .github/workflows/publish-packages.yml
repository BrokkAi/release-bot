name: Publish packages
run-name: Release ${{ inputs.tag || github.ref_name }} (publish=${{ github.event_name == 'push' || inputs.publish }})

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release version; preflight may dispatch from master before the tag exists
        required: true
        type: string
      publish:
        description: Publish selected registries after validation (false only builds and checks)
        type: boolean
        default: false
      registry:
        description: Registries to publish (PyPI requires its own trusted publisher)
        type: choice
        default: npm
        options: [all, npm, pypi]

permissions:
  contents: read

concurrency:
  group: release-bot-packages
  cancel-in-progress: false

jobs:
  native:
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      publish: false
  packages:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: packages-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Require master or the exact release tag
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          PACKAGE_REGISTRY: ${{ inputs.registry || 'npm' }}
        run: |
          test "$RELEASE_REF" = refs/heads/master || test "$RELEASE_REF" = "refs/tags/$RELEASE_TAG"
          if [[ "$PACKAGE_REGISTRY" != npm ]]; then
            printf '%s\n' 'PyPI is blocked until its publishing identity has a non-publishing authorization check.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.3'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Validate actual npm publisher without uploading
        if: inputs.registry != 'pypi'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: python3 scripts/npm_authorization.py
      - name: Build native assets without requiring publication
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release.py package "$RELEASE_TAG" dist/native
      - name: Test launchers and build packages from verified assets
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 -m unittest discover -s scripts -p '*_test.py' -v
          node --test --test-isolation=none npm/brb.test.cjs
          python3 scripts/package_installers.py "$RELEASE_TAG" dist/native dist/packages
          python3 scripts/smoke_installers.py --tag "$RELEASE_TAG" --assets dist/native --packages dist/packages
      - name: Check version availability and existing package integrity
        env:
          PACKAGE_REGISTRY: ${{ inputs.registry || 'npm' }}
        run: python3 scripts/package_registry.py check dist/packages --registry "$PACKAGE_REGISTRY"
      - name: Validate GitHub publisher and all destination versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release_pipeline.py preflight "$RELEASE_TAG" dist/native dist/packages
      - name: Save validated packages for review and bootstrap publication
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: packages-${{ inputs.tag || github.ref_name }}
          path: dist/packages/
          if-no-files-found: error
      - name: Publish npm then finalize GitHub release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release_pipeline.py publish "$RELEASE_TAG" dist/native dist/packages
