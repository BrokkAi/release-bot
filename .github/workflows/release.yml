name: Release
run-name: Release ${{ inputs.tag }} (publish=${{ inputs.publish }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release, such as v0.1.0
        required: true
        type: string
      publish:
        description: Publish after every check passes (false runs preflight only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-bot-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the release branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != refs/heads/master ]]; then
            echo 'Run releases from master so the workflow and its artifacts use the same tested commit.' >&2
            exit 1
          fi

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml

  package:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Build and validate all Linux and macOS archives
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/release.py package "$RELEASE_TAG" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Validate publisher and optionally publish
    needs: [checks, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: dist
      - name: Check every artifact and the actual publishing credential
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/release.py preflight "$RELEASE_TAG" dist
      - name: Stage, verify and publish complete release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/release.py publish "$RELEASE_TAG" dist
      - name: Explain preflight result
        if: ${{ !inputs.publish }}
        run: echo 'All checks passed. The release remains an unpublished draft. Run again with publish=true to publish.' >> "$GITHUB_STEP_SUMMARY"
